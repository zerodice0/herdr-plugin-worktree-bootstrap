id = "zerodice0.worktree-bootstrap"
name = "Worktree Bootstrap"
version = "0.3.1"
min_herdr_version = "0.7.0"
description = "Bootstrap new worktrees and interactively review local branch cleanup after removal."
platforms = ["linux", "macos"]

[[actions]]
id = "bootstrap"
title = "Bootstrap worktree"
contexts = ["workspace"]
command = ["python3", "worktree_bootstrap.py", "bootstrap"]

[[actions]]
id = "sync"
title = "Sync local worktree files"
contexts = ["workspace"]
command = ["python3", "worktree_bootstrap.py", "sync"]

[[actions]]
id = "setup"
title = "Run worktree setup"
contexts = ["workspace"]
command = ["python3", "worktree_bootstrap.py", "setup"]

[[actions]]
id = "status"
title = "Show worktree bootstrap status"
contexts = ["workspace"]
command = ["python3", "worktree_bootstrap.py", "status"]

[[actions]]
id = "manage"
title = "Worktree bootstrap settings"
contexts = ["workspace"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "zerodice0.worktree-bootstrap",
  "--entrypoint",
  "manage",
  "--placement",
  "popup",
  "--width",
  "74%",
  "--height",
  "70%",
  "--focus",
]

[[actions]]
id = "configure-setup"
title = "Configure worktree setup commands"
contexts = ["workspace"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "zerodice0.worktree-bootstrap",
  "--entrypoint",
  "setup-manage",
  "--placement",
  "popup",
  "--width",
  "68%",
  "--height",
  "66%",
  "--focus",
]

[[actions]]
id = "review-branch-cleanup"
title = "Review pending branch cleanup"
contexts = ["workspace", "global"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "zerodice0.worktree-bootstrap",
  "--entrypoint",
  "branch-cleanup",
  "--placement",
  "popup",
  "--width",
  "68%",
  "--height",
  "50%",
  "--focus",
]

[[events]]
on = "worktree.created"
command = ["python3", "worktree_bootstrap.py", "bootstrap"]

[[events]]
on = "worktree.removed"
command = ["python3", "worktree_bootstrap.py", "branch-cleanup-event"]

[[panes]]
id = "manage"
title = "Worktree bootstrap settings"
placement = "popup"
command = ["python3", "worktree_bootstrap.py", "manage"]

[[panes]]
id = "setup-manage"
title = "Configure worktree setup commands"
placement = "popup"
command = ["python3", "worktree_bootstrap.py", "setup-manage"]

[[panes]]
id = "branch-cleanup"
title = "Review branch cleanup"
placement = "popup"
command = ["python3", "worktree_bootstrap.py", "branch-cleanup"]
